name: fashion_companion_app
description: "AI Fashion Companion - Outfit of the Day (OTD) mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  dio: ^5.4.3+1
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
