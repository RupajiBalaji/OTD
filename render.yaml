# =============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Project: OTD (Outfit of the Day) - AI Fashion Platform
# Repository: https://github.com/RupajiBalaji/OTD.git
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API Service (Node.js / Express / TypeScript / Mongoose)
  # ---------------------------------------------------------------------------
  - type: web
    name: otd-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      # MongoDB connection URI (e.g. from MongoDB Atlas: mongodb+srv://<user>:<password>@cluster.mongodb.net/ai_fashion_otd?retryWrites=true&w=majority)
      - key: MONGO_URI
        sync: false
      # High-entropy random JWT secrets automatically generated by Render
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Allowed frontend origins for CORS (e.g. https://otd-web.onrender.com,http://localhost:5173)
      - key: CORS_ORIGIN
        sync: false
      # Foundation Model AI Gateway (Gemini API / Rules engine fallback)
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_IMAGE_MODEL_PRO
        value: gemini-3-pro-image-preview
      # Security & Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: UPLOAD_MAX_SIZE_MB
        value: "10"

  # ---------------------------------------------------------------------------
  # 2. Frontend Web Application (React / Vite / Tailwind CSS / Motion)
  # ---------------------------------------------------------------------------
  - type: web
    name: otd-web
    env: static
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # Single-Page Application (SPA) catch-all rewrite rule for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend API URL (e.g. https://otd-backend.onrender.com/api/v1)
      - key: VITE_API_BASE_URL
        sync: false
