version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otd-backend-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_PREFIX=/api/v1
      - MONGO_URI=mongodb://mongo:27017/ai_fashion_otd?replicaSet=rs0
      - JWT_ACCESS_SECRET=production_super_secret_jwt_access_token_otd_atelier_2026
      - JWT_REFRESH_SECRET=production_super_secret_jwt_refresh_token_otd_atelier_2026
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,https://otd-atelier.luxury
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - UPLOAD_MAX_SIZE_MB=10
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - otd-network

  mongo:
    image: mongo:7.0
    container_name: otd-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: echo "try { rs.status().ok } catch (e) { rs.initiate().ok }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - otd-network

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local

networks:
  otd-network:
    driver: bridge
